<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="文字をクリックしてコピーできます。" />
    <title>文字コピー</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="card" aria-labelledby="page-title">
        <p class="eyebrow">文字一覧</p>
        <h1 id="page-title">文字をコピー</h1>
        <p class="intro">下の文字を選択すると、クリップボードにコピーできます。</p>

        <div id="characters" class="character-grid" aria-live="polite"></div>
        <p id="status" class="status" role="status">コピーする文字を選択してください。</p>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
